meta:
  profile: engineering-review
  theme: tech-blue
  source: generated
  layout: vertical
  routing: orthogonal
  canvas: 1520x2080
  title: "MateClaw 智能排障端到端流程"
  description: "从报障到有界调查内循环、结构化反证、人工闭环和经审核 Playbook 的完整流程。"

nodes:
  - id: start
    label: "企微 @ / Web / 告警"
    type: terminal
    size: large
    position: { x: 720, y: 64 }
  - id: intake
    label: "接收并脱敏报障上下文"
    type: process
    size: large
    position: { x: 760, y: 176 }
  - id: complete
    label: "关键字段完整？"
    type: decision
    size: large
    position: { x: 760, y: 288 }
  - id: ask
    label: "补问客户 / 时间 / 截图"
    type: process
    size: large
    position: { x: 1104, y: 288 }
  - id: route
    label: "选择调查路径与权威"
    type: decision
    size: large
    position: { x: 760, y: 416 }

  - id: errorCode
    label: "错误码 Playbook · 零 LLM"
    type: process
    size: large
    position: { x: 352, y: 544 }
    style: { fillColor: "#ECFDF5", strokeColor: "#059669" }
  - id: scenario
    label: "场景 Playbook · 注册键提议"
    type: process
    size: large
    position: { x: 760, y: 544 }
    style: { fillColor: "#FFF7ED", strokeColor: "#D97706" }
  - id: discovery
    label: "OPEN_DISCOVERY · 受限 Agent"
    type: process
    size: large
    position: { x: 1168, y: 544 }
    style: { fillColor: "#EFF6FF", strokeColor: "#2563EB" }

  - id: loopController
    label: "Loop Control · 有界执行"
    type: process
    size: large
    position: { x: 760, y: 672 }
    style: { fillColor: "#DBEAFE", strokeColor: "#2563EB" }
  - id: collect
    label: "只读取证 · 脱敏 · 压缩"
    type: process
    size: large
    position: { x: 760, y: 800 }
  - id: proposal
    label: "候选结论 · 规则 / 受限 Agent"
    type: process
    size: large
    position: { x: 760, y: 928 }
  - id: evidenceOk
    label: "Verify Gate · 通过？"
    type: decision
    size: large
    position: { x: 760, y: 1056 }
  - id: abstain
    label: "证据不足 / 超限 · 转人工"
    type: terminal
    size: large
    position: { x: 1120, y: 1056 }
    style: { fillColor: "#FEF2F2", strokeColor: "#DC2626" }
  - id: diagnosis
    label: "Diagnosis · 定位 / 排除 / 假设"
    type: process
    size: large
    position: { x: 760, y: 1184 }
  - id: close
    label: "人工处置 / outcome / 关闭"
    type: terminal
    size: large
    position: { x: 760, y: 1312 }

  - id: draft
    label: "生成 PlaybookDraft"
    type: document
    size: large
    position: { x: 320, y: 1184 }
  - id: validate
    label: "确定性校验"
    type: process
    size: large
    position: { x: 320, y: 1312 }
  - id: candidate
    label: "Candidate · 幂等 / 不可路由"
    type: database
    size: large
    position: { x: 320, y: 1440 }
  - id: adversarialEval
    label: "结构化反证 · P2 影子"
    type: process
    size: large
    position: { x: 320, y: 1568 }
    style: { fillColor: "#FEF3C7", strokeColor: "#D97706" }
  - id: review
    label: "确定性回放 + 专家审核"
    type: process
    size: large
    position: { x: 320, y: 1696 }
  - id: approvedDecision
    label: "满足晋升资格？"
    type: decision
    size: large
    position: { x: 320, y: 1824 }
  - id: approved
    label: "Approved Playbook · 新版本"
    type: terminal
    size: large
    position: { x: 112, y: 1952 }
    style: { fillColor: "#ECFDF5", strokeColor: "#059669" }
  - id: rejected
    label: "Rejected · 保留审计"
    type: terminal
    size: large
    position: { x: 528, y: 1952 }
    style: { fillColor: "#FEF2F2", strokeColor: "#DC2626" }

edges:
  - from: start
    to: intake
    type: primary
  - from: intake
    to: complete
    type: primary
  - from: complete
    to: ask
    type: optional
    label: "否"
    labelOffset: { x: 0, y: -16 }
  - from: ask
    to: intake
    type: optional
    label: "补齐后重试"
    labelOffset: { x: 16, y: 0 }
    waypoints:
      - { x: 1056, y: 192 }
      - { x: 816, y: 192 }
  - from: complete
    to: route
    type: primary
    label: "是"
    labelOffset: { x: 16, y: 0 }
  - from: route
    to: errorCode
    type: primary
    label: "显式错误码命中"
    labelOffset: { x: 0, y: -16 }
  - from: route
    to: scenario
    type: primary
    label: "注册场景"
    labelOffset: { x: 16, y: 0 }
  - from: route
    to: discovery
    type: optional
    label: "无匹配"
    labelOffset: { x: 0, y: -16 }
  - from: errorCode
    to: loopController
    type: primary
  - from: scenario
    to: loopController
    type: primary
  - from: discovery
    to: loopController
    type: primary
  - from: loopController
    to: collect
    type: primary
  - from: collect
    to: proposal
    type: primary
  - from: proposal
    to: evidenceOk
    type: primary
  - from: evidenceOk
    to: abstain
    type: optional
    label: "证据不足 / 到限"
    labelOffset: { x: 0, y: -16 }
  - from: evidenceOk
    to: loopController
    type: optional
    label: "存在 EvidenceGap 且预算内"
    labelOffset: { x: 16, y: 0 }
    waypoints:
      - { x: 1288, y: 1056 }
      - { x: 1288, y: 672 }
      - { x: 856, y: 672 }
  - from: evidenceOk
    to: diagnosis
    type: primary
    label: "通过"
    labelOffset: { x: 16, y: 0 }
  - from: abstain
    to: close
    type: optional
    label: "人工接管"
    labelOffset: { x: 0, y: -16 }
  - from: diagnosis
    to: close
    type: primary
  - from: diagnosis
    to: draft
    type: data
    label: "可在关闭前产生"
    labelOffset: { x: 0, y: -16 }
  - from: draft
    to: validate
    type: primary
  - from: validate
    to: candidate
    type: primary
  - from: candidate
    to: adversarialEval
    type: primary
  - from: adversarialEval
    to: review
    type: primary
  - from: close
    to: review
    type: data
    label: "人工解法 / outcome"
    labelOffset: { x: 0, y: -16 }
    waypoints:
      - { x: 760, y: 1696 }
      - { x: 416, y: 1696 }
  - from: review
    to: approvedDecision
    type: primary
  - from: approvedDecision
    to: approved
    type: primary
    label: "是"
    labelOffset: { x: 0, y: -16 }
  - from: approvedDecision
    to: rejected
    type: optional
    label: "否"
    labelOffset: { x: 0, y: -16 }
  - from: approved
    to: route
    type: data
    label: "版本化知识反馈"
    labelOffset: { x: 16, y: 0 }
    waypoints:
      - { x: 48, y: 1952 }
      - { x: 48, y: 416 }
      - { x: 664, y: 416 }
