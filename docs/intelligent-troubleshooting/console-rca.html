<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能排障 · 根因定位</title>
<style>
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef2f7;
    --ink-1:#0f1622; --ink-2:#3b4453; --ink-3:#727e91; --ink-4:#a3adbd;
    --line:#e3e7ee; --line-2:#eef1f6;
    --accent:#2f5cf5; --accent-weak:#eaeffe; --accent-line:#c7d4fb;
    --good:#0e9f6e; --good-weak:#e6f6ef;
    --warn:#d98207; --warn-weak:#fbf1e0;
    --crit:#e14b4b; --crit-weak:#fceceb;
    --console:#0e1420; --console-ink:#c9d6ef; --console-dim:#5f6f8f; --console-line:#20293a;
    --shadow-sm:0 1px 2px rgba(15,22,34,.04),0 1px 3px rgba(15,22,34,.05);
    --shadow-md:0 2px 4px rgba(15,22,34,.05),0 4px 12px rgba(15,22,34,.06);
    --mono:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --r-lg:12px; --r-md:9px; --r-sm:6px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0e14; --surface:#141922; --surface-2:#1a2029; --surface-3:#202834;
    --ink-1:#eef1f6; --ink-2:#c0c8d4; --ink-3:#8591a1; --ink-4:#5b6675;
    --line:#26303d; --line-2:#1e2632;
    --accent:#6a8bff; --accent-weak:#1a2540; --accent-line:#2f3f6b;
    --good:#2fbb85; --good-weak:#12271f;
    --warn:#e6a13c; --warn-weak:#2a2113;
    --crit:#ef6b6b; --crit-weak:#2c1717;
    --console:#0a0e16; --console-ink:#c3d2ef; --console-dim:#556584; --console-line:#1a2333;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35);
  }}
  :root[data-theme="light"]{
    --bg:#eef1f6;--surface:#fff;--surface-2:#f6f8fb;--surface-3:#eef2f7;--ink-1:#0f1622;--ink-2:#3b4453;--ink-3:#727e91;--ink-4:#a3adbd;--line:#e3e7ee;--line-2:#eef1f6;--accent:#2f5cf5;--accent-weak:#eaeffe;--accent-line:#c7d4fb;--good:#0e9f6e;--good-weak:#e6f6ef;--warn:#d98207;--warn-weak:#fbf1e0;--crit:#e14b4b;--crit-weak:#fceceb;--console:#0e1420;--console-ink:#c9d6ef;--console-dim:#5f6f8f;--console-line:#20293a;--shadow-sm:0 1px 2px rgba(15,22,34,.04),0 1px 3px rgba(15,22,34,.05);--shadow-md:0 2px 4px rgba(15,22,34,.05),0 4px 12px rgba(15,22,34,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0b0e14;--surface:#141922;--surface-2:#1a2029;--surface-3:#202834;--ink-1:#eef1f6;--ink-2:#c0c8d4;--ink-3:#8591a1;--ink-4:#5b6675;--line:#26303d;--line-2:#1e2632;--accent:#6a8bff;--accent-weak:#1a2540;--accent-line:#2f3f6b;--good:#2fbb85;--good-weak:#12271f;--warn:#e6a13c;--warn-weak:#2a2113;--crit:#ef6b6b;--crit-weak:#2c1717;--console:#0a0e16;--console-ink:#c3d2ef;--console-dim:#556584;--console-line:#1a2333;--shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow-md:0 4px 14px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);color:var(--ink-2);background:var(--bg);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .num,.mono{font-variant-numeric:tabular-nums}
  svg{display:block;flex-shrink:0}
  .app{display:flex;height:100dvh;overflow:hidden}

  .rail{width:52px;background:var(--ink-1);flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:3px}
  @media (prefers-color-scheme:dark){.rail{background:#05070b}}
  :root[data-theme="dark"] .rail{background:#05070b}
  .rail .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,var(--accent),#12a3c9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;margin-bottom:8px}
  .rail a{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#6b7686;text-decoration:none;transition:.15s}
  .rail a:hover{color:#c3ccd8}
  .rail a.active{background:rgba(255,255,255,.08);color:#fff}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .top{height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
  .crumb{color:var(--ink-3);font-size:12.5px;display:flex;align-items:center;gap:7px}
  .crumb .id{font-family:var(--mono);color:var(--ink-1);font-weight:600}
  .crumb svg{color:var(--ink-4)}
  .demoflag{font-size:11px;color:var(--ink-4);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
  .seg{margin-left:auto;display:flex;background:var(--surface-3);border-radius:8px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;padding:6px 13px;border-radius:6px;font-size:12px;color:var(--ink-3);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;transition:.15s}
  .seg button:hover{color:var(--ink-2)}
  .seg button.on{background:var(--surface);color:var(--ink-1);font-weight:600;box-shadow:var(--shadow-sm)}
  .seg .dot{width:7px;height:7px;border-radius:2px}
  .seg .dot.det{border-radius:50%;background:var(--good)}
  .seg .dot.llm{background:var(--warn);transform:rotate(45deg)}

  .content{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 306px;overflow:hidden}
  .locate{overflow-y:auto;padding:22px 26px 40px}
  .locate::-webkit-scrollbar,.side::-webkit-scrollbar,.qbody::-webkit-scrollbar{width:8px}
  .locate::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;border:2px solid var(--bg)}
  .side{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 18px 30px;display:flex;flex-direction:column;gap:14px}

  /* identity */
  .idrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:18px}
  .idcode{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink-1)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;line-height:1}
  .chip .sh{width:7px;height:7px}
  .chip.det{background:var(--good-weak);color:var(--good)}.chip.det .sh{border-radius:50%;background:currentColor}
  .chip.llm{background:var(--warn-weak);color:var(--warn)}.chip.llm .sh{background:currentColor;transform:rotate(45deg)}
  .idkv{font-size:12px;color:var(--ink-3)}
  .idkv b{color:var(--ink-2);font-weight:600}
  .idkv .m{font-family:var(--mono);color:var(--ink-1);font-weight:600}
  .vsep{width:1px;height:13px;background:var(--line)}

  /* ROOT CAUSE: answer first */
  .answer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:19px 22px;position:relative;overflow:hidden}
  .answer::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--good),transparent 65%)}
  .answer.abst::after{background:linear-gradient(90deg,var(--warn),transparent 65%)}
  .eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
  .eyebrow .glyph{width:15px;height:15px;color:var(--good)}
  .answer.abst .eyebrow .glyph{color:var(--warn)}
  .eyebrow .speed{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--good);letter-spacing:.01em;text-transform:none;font-weight:600}
  .answer.abst .eyebrow .speed{color:var(--warn)}
  .rc{font-size:22px;line-height:1.34;font-weight:700;letter-spacing:-.015em;color:var(--ink-1);margin:11px 0 0;text-wrap:balance}
  .rc.abst{color:var(--warn)}
  .rcmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:13px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .conf{display:inline-flex;align-items:center;gap:8px}
  .conf .track{width:96px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
  .conf .fill{height:100%;border-radius:3px}
  .conf .fill.hi{background:linear-gradient(90deg,#3bb98a,var(--good))}
  .conf .fill.lo{background:linear-gradient(90deg,#eab35a,var(--warn))}
  .conf b{font-weight:700;font-size:12.5px}.conf b.hi{color:var(--good)}.conf b.lo{color:var(--warn)}
  .rcmeta .mdot{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}

  /* narrowing funnel */
  .funnel{margin:18px 0 22px;display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:12px}
  .funnel .flabel{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-right:14px;margin-right:2px}
  .funnel .flabel svg{width:14px;height:14px;color:var(--ink-4)}
  .fstep{display:flex;align-items:center}
  .fnode{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
  .fnode .fb{font-family:var(--mono);font-size:12px;font-weight:600;padding:4px 11px;border-radius:7px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;transition:.15s}
  .fnode.narrow .fb{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}
  .fnode.final .fb{background:var(--good);border-color:var(--good);color:#fff}
  .fnode.final.abst .fb{background:var(--warn);border-color:var(--warn)}
  .fnode .fc{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);padding-left:2px;letter-spacing:.02em}
  .fconn{width:26px;height:1.5px;background:var(--line);margin:0 3px;position:relative;flex-shrink:0}
  .fconn::after{content:"";position:absolute;right:0;top:-2px;border-left:4px solid var(--line);border-top:2.5px solid transparent;border-bottom:2.5px solid transparent}

  /* chain */
  .spinehd{display:flex;align-items:center;gap:9px;margin-bottom:15px}
  .spinehd .st{font-size:14px;font-weight:650;letter-spacing:-.01em;color:var(--ink-1)}
  .spinehd .sh-ic{width:16px;height:16px;color:var(--accent)}
  .spinehd .hint{margin-left:auto;font-size:11px;color:var(--ink-4)}
  .chain{display:flex;flex-direction:column}
  .stg{display:flex;gap:15px;position:relative;padding-bottom:12px}
  .stg:last-child{padding-bottom:0}
  .srail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:36px}
  .snode{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;z-index:1;border:1px solid transparent}
  .snode svg{width:17px;height:17px}
  .snode .n{font-family:var(--mono);font-size:14px;font-weight:700}
  .snode.sym{background:var(--crit-weak);color:var(--crit)}
  .snode.loc,.snode.ev,.snode.rsn{background:var(--accent-weak);color:var(--accent)}
  .snode.hyp{background:var(--surface-3);color:var(--ink-3);border-color:var(--line)}
  .snode.dead{background:var(--surface-2);color:var(--ink-4)}
  .snode.root{background:var(--good);color:#fff}
  .snode.root.abst{background:var(--warn)}
  .sconn{flex:1;width:2px;background:var(--line);margin:4px 0;border-radius:2px}
  .stg:last-child .sconn{display:none}
  .sbody{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm);overflow:hidden;transition:border-color .15s}
  .sbody.root{border-color:var(--good);box-shadow:0 0 0 1px var(--good-weak),var(--shadow-sm)}
  .sbody.deadcard{opacity:.72}
  .shd{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .shd:hover{background:var(--surface-2)}
  .shd .stt{font-size:13px;font-weight:650;color:var(--ink-1);letter-spacing:-.005em}
  .shd .stime{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);margin-left:auto;letter-spacing:.01em}
  .shd .caret{width:15px;height:15px;color:var(--ink-4);transition:transform .22s ease}
  .stg.open .caret{transform:rotate(90deg)}
  .sfind{padding:0 14px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
  .sfind b{color:var(--ink-1);font-weight:650}
  .sfind .mn{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);border-radius:4px;padding:1px 5px;color:var(--ink-1)}
  .narrowto{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-weak);border:1px solid var(--accent-line);border-radius:6px;padding:3px 9px}
  .narrowto svg{width:12px;height:12px}
  .narrowto.dead{color:var(--warn);background:var(--warn-weak);border-color:transparent}
  .sdrawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
  .stg.open .sdrawer{grid-template-rows:1fr}
  .sdinner{overflow:hidden}
  .sdpad{border-top:1px solid var(--line-2);padding:12px 14px;background:var(--surface-2)}
  .sdpad>.txt{font-size:12px;color:var(--ink-2);line-height:1.6}
  .sdpad>.txt .mn{font-family:var(--mono);font-size:11px;background:var(--surface-3);border-radius:4px;padding:1px 5px;color:var(--ink-1)}

  /* reasoning verdicts */
  .verdict{display:flex;gap:9px;align-items:flex-start;font-size:12px;padding:5px 0;line-height:1.5}
  .verdict+.verdict{border-top:1px dashed var(--line)}
  .vmark{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
  .vmark svg{width:11px;height:11px}
  .verdict.pos .vmark{background:var(--good-weak);color:var(--good)}
  .verdict.maybe .vmark{background:var(--warn-weak);color:var(--warn)}
  .verdict.neg .vmark{background:var(--surface-3);color:var(--ink-4)}
  .verdict .vt{color:var(--ink-2)}.verdict .vt b{color:var(--ink-1);font-weight:650}

  /* evidence */
  .ev{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
  .ev+.ev{margin-top:9px}
  .ev.key{border-color:var(--accent-line)}
  .evh{padding:8px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .eid{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:2px 6px;letter-spacing:.02em}
  .ett{font-size:12px;font-weight:600;color:var(--ink-1)}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.02em}
  .badge svg{width:10px;height:10px}
  .badge.key{color:var(--warn);background:var(--warn-weak)}
  .badge.ro{color:var(--good);background:var(--good-weak)}
  .evh .plat{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-4)}
  .query{background:var(--console);color:var(--console-ink);font-family:var(--mono);font-size:10.5px;line-height:1.7;padding:9px 11px;overflow-x:auto;display:flex;align-items:center;gap:10px;white-space:pre}
  .query .q{color:var(--console-dim)}
  .query .qk{color:#6aa3ff}.query .qs{color:#4bbf9a}
  .query .run{margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:4px;color:#67d29a;border:1px solid var(--console-line);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:10px;transition:.15s}
  .query .run:hover{background:rgba(103,210,154,.12)}
  .query .run svg{width:10px;height:10px}
  .obsgrid{padding:9px 11px;display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
  .obs{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;padding:2px 0}
  .obs .of{color:var(--ink-3)}
  .obs .ov{font-weight:600;color:var(--ink-1)}
  .obs .ov.bad{color:var(--crit)}
  .evf{padding:6px 11px;border-top:1px solid var(--line-2);background:var(--surface-2);display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .ver{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:600}
  .ver .vd{width:7px;height:7px;border-radius:50%}
  .ver.ok{color:var(--good)}.ver.ok .vd{background:currentColor}
  .ver.miss{color:var(--warn)}.ver.miss .vd{border:1.5px solid currentColor}

  /* handoff */
  .handoff{border:1px solid var(--accent-line);background:var(--accent-weak);border-radius:var(--r-sm);padding:11px 13px}
  .handoff .ht{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .handoff .ht svg{width:13px;height:13px}
  .handoff ol{margin:0;padding-left:0;list-style:none;counter-reset:h}
  .handoff li{counter-increment:h;font-size:12px;color:var(--ink-2);padding:3px 0 3px 24px;position:relative;line-height:1.5}
  .handoff li::before{content:counter(h);position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:5px;background:var(--surface);border:1px solid var(--accent-line);color:var(--accent);font-family:var(--mono);font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .similar{margin-top:11px}
  .similar .slh{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
  .simrow{display:flex;align-items:center;gap:9px;font-size:12px;padding:5px 0;border-top:1px solid var(--line)}
  .simrow .sc{font-family:var(--mono);font-weight:600;color:var(--accent)}
  .simrow .sd{color:var(--ink-2)}
  .simrow .ss{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

  /* side */
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px}
  .card .clabel{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .card .clabel svg{width:13px;height:13px;color:var(--ink-4)}
  .clk{display:flex;align-items:baseline;gap:8px}
  .clk .big{font-family:var(--mono);font-size:21px;font-weight:700;color:var(--ink-1);letter-spacing:-.01em}
  .clk .u{font-size:11px;color:var(--ink-3)}
  .rem{font-family:var(--mono);font-size:12px;margin-top:6px;color:var(--warn)}
  .rem b{font-weight:700}
  .rem.crit{color:var(--crit)}
  .recact .rt{font-size:12.5px;font-weight:650;color:var(--ink-1);display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.4}
  .recact .rd{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.5}
  .tagw{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--crit-weak);color:var(--crit)}
  .stale{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--warn);background:var(--warn-weak);border-radius:4px;padding:2px 6px}
  .stale svg{width:10px;height:10px}
  .btn{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:9px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:9px;transition:.15s}
  .btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-weak)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.06);color:#fff}
  .btn svg{width:14px;height:14px}
  .note{display:flex;gap:7px;font-size:10.5px;line-height:1.5;color:var(--ink-3);margin-top:10px}

function stageHtml(s,i){

 const nodeCls = s.t==='hyp' ? (s.dead?'hyp dead':'hyp') : s.t + (s.abst?' abst':'');
 let inner='';
 if(s.detail&&s.detail.txt) inner=`<div class="txt">${s.detail.txt}</div>`;
 if(s.reasons) inner=s.reasons.map(([k,t])=>`<div class="verdict ${k}"><span class="vmark">${ic(k==='pos'?'check':k==='maybe'?'spark':'arrow')}</span><span class="vt">${t}</span></div>`).join('');
 if(s.evidence) inner=`<div class="evidence-grid">${s.evidence.map(evHtml).join('')}</div>`;
 if(s.handoff){
   inner=`<div class="handoff"><div class="ht">${ic('spark')}系统替开发减负：建议下一步先查</div>
     <ol>${s.handoff.next.map(n=>`<li>${n}</li>`).join('')}</ol>
     <div class="similar"><div class="slh">相似历史故障：可借鉴定位路径</div>
       ${s.handoff.similar.map(([c,d,sc])=>`<div class="simrow"><span class="sc">${c}</span><span class="sd">${d}</span><span class="ss">相似 ${sc}</span></div>`).join('')}</div></div>`;
 }
 const hasDrawer=inner!=='';
 const openByDefault = s.root||s.t==='ev'||s.t==='rsn'||s.t==='hyp';
 const narrowCls = (s.narrowKind==='dead'||s.narrowKind==='maybe')?'narrowto dead':'narrowto';
 return `<div class="stg ${openByDefault?'open':''}" id="stg-${i}">
   <div class="srail"><div class="snode ${nodeCls}">${nodeIc}</div><div class="sconn"></div></div>
   <div class="sbody ${s.root?'root':''} ${s.dead?'deadcard':''}">
     <div class="shd" tabindex="0" role="button" aria-expanded="${openByDefault?'true':'false'}" onclick="tog(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tog(${i})}">
       <span class="stt">${s.label}</span><span class="stime">${s.time}</span>${hasDrawer?ic('chevron','caret'):''}</div>
     <div class="sfind">${s.find}${s.narrow?`<br><span class="${narrowCls}">${ic('arrow')}${s.narrow}</span>`:''}</div>
     ${hasDrawer?`<div class="sdrawer"><div class="sdinner"><div class="sdpad">${inner}</div></div></div>`:''}
   </div></div>`;
}
