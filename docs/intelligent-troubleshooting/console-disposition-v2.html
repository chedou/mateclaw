<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能排障 · 故障处置页原型 v2（决策中心）</title>
<style>
  :root{
    --primary:#409EFF;--primary-d:#337ecc;--success:#67C23A;--warning:#E6A23C;
    --danger:#F56C6C;--danger-d:#c45656;--info:#909399;
    --t1:#303133;--t2:#606266;--t3:#909399;--t4:#A8ABB2;
    --bd:#DCDFE6;--bd-l:#EBEEF5;--bg:#F5F7FA;--bg2:#FAFAFA;--white:#fff;
    --radius:6px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--t1);background:var(--bg);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;height:100vh;overflow:hidden}

  /* platform nav */
  .nav{width:56px;background:#141a26;color:#c0c4cc;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px}
  .nav .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#409EFF,#67C23A);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;margin-bottom:8px}
  .nav a{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8890a0;text-decoration:none;font-size:16px}
  .nav a.active{background:#1c2432;color:#fff}
  .nav a:hover{color:#fff}

  /* QUEUE RAIL */
  .queue{width:216px;background:var(--white);border-right:1px solid var(--bd-l);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}
  .queue .qh{padding:13px 14px;border-bottom:1px solid var(--bd-l);display:flex;align-items:center;gap:8px}
  .queue .qh b{font-size:14px}
  .queue .qh .cnt{margin-left:auto;background:#fef0f0;color:var(--danger);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600}
  .qfilter{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--bd-l)}
  .qfilter span{font-size:11px;color:var(--t3);padding:3px 8px;border-radius:4px;cursor:pointer}
  .qfilter span.on{background:#ecf5ff;color:var(--primary);font-weight:600}
  .qlist{flex:1;overflow-y:auto}
  .qitem{padding:11px 13px;border-bottom:1px solid var(--bd-l);cursor:pointer;border-left:3px solid transparent}
  .qitem:hover{background:var(--bg2)}
  .qitem.active{background:#ecf5ff;border-left-color:var(--primary)}
  .qitem .r1{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .qitem .code{font-family:ui-monospace,monospace;font-size:12px;font-weight:600}
  .qitem .r2{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qitem .r3{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px}
  .sla{display:inline-flex;align-items:center;gap:3px;color:var(--t3)}
  .sla.warn{color:var(--warning);font-weight:600}
  .sla.crit{color:var(--danger);font-weight:600}
  .prio{font-size:10px;font-weight:700;padding:0 5px;border-radius:3px;letter-spacing:.3px}
  .prio.p0{background:#fef0f0;color:var(--danger)}
  .prio.p1{background:#fdf6ec;color:var(--warning)}

  /* route chip: color+shape+text redundancy */
  .rchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:3px}
  .rchip .sh{width:8px;height:8px;flex-shrink:0}
  .rchip.det{background:#f0f9eb;color:#5aaa2e}.rchip.det .sh{background:#67C23A;border-radius:50%}
  .rchip.llm{background:#fdf6ec;color:#b88230}.rchip.llm .sh{background:#E6A23C;transform:rotate(45deg)}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:52px;background:var(--white);border-bottom:1px solid var(--bd-l);display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0}
  .crumb{color:var(--t3)}.crumb b{color:var(--t1)}
  .demoflag{font-size:10.5px;color:var(--t4);border:1px dashed var(--bd);border-radius:4px;padding:2px 7px}
  .switcher{display:flex;gap:6px;margin-left:auto}
  .switcher button{border:1px solid var(--bd);background:var(--white);padding:5px 11px;border-radius:5px;font-size:12px;color:var(--t2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
  .switcher button.on{border-color:var(--primary);color:var(--primary);background:#ecf5ff;font-weight:600}

  /* content = understand (left/center) + act (right) */
  .content{flex:1;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
  .understand{overflow-y:auto;padding:16px 18px}
  .act{border-left:1px solid var(--bd-l);background:var(--white);overflow-y:auto;display:flex;flex-direction:column}

  /* identity strip */
  .idstrip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .idstrip .idcode{font-family:ui-monospace,monospace;font-size:20px;font-weight:700}
  .idstrip .idkv{font-size:12px;color:var(--t2)}
  .idstrip .idkv b{color:var(--t1)}
  .idstrip .sep{width:1px;height:16px;background:var(--bd)}

  /* HERO diagnosis */
  .hero{background:var(--white);border:1px solid var(--bd-l);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .hero.det::before{background:var(--success)}
  .hero.llm::before{background:var(--warning)}
  .hero .hlabel{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .hero .rootcause{font-size:20px;font-weight:700;line-height:1.35;color:var(--t1);margin-bottom:4px}
  .hero .rootcause.abst{color:var(--warning)}
  .hero .rcsub{font-size:12.5px;color:var(--t3);margin-bottom:14px}

  /* confidence meter with reference frame */
  .confwrap{display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .meter{flex:1;max-width:360px}
  .meter .mtop{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:4px}
  .meter .track{height:8px;background:linear-gradient(90deg,#fde2e2 0%,#faecd8 45%,#e1f3d8 75%,#e1f3d8 100%);border-radius:5px;position:relative}
  .meter .thresh{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--t2);left:70%}
  .meter .thresh::after{content:"阈值 0.70";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--t2);white-space:nowrap}
  .meter .ptr{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;border:3px solid var(--white);box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translateX(-50%)}
  .meter .ptr.hi{background:var(--success)}.meter .ptr.lo{background:var(--warning)}
  .confbig{text-align:center}
  .confbig .num{font-size:26px;font-weight:700;line-height:1}
  .confbig .num.hi{color:var(--success)}.confbig .num.lo{color:var(--warning)}
  .confbig .lab{font-size:11px;font-weight:600;margin-top:2px}
  .confbig .lab.hi{color:var(--success)}.confbig .lab.lo{color:var(--warning)}

  .recact{background:var(--bg2);border:1px solid var(--bd-l);border-radius:5px;padding:11px 13px;display:flex;align-items:flex-start;gap:10px}
  .recact .ra-ic{width:26px;height:26px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .recact .ra-ic.write{background:#fef0f0;color:var(--danger)}
  .recact .ra-t{font-weight:600;font-size:13px}
  .recact .ra-d{font-size:11.5px;color:var(--t3);margin-top:2px}

  /* evidence, ranked by leverage, adjacent to cause */
  .evsec{margin-bottom:14px}
  .evsec h3{font-size:13px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px}
  .evsec h3 .hint{font-weight:400;font-size:11px;color:var(--t3);margin-left:auto}
  .ev{background:var(--white);border:1px solid var(--bd-l);border-radius:var(--radius);margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow)}
  .ev.decisive{border-color:#f5c98a}
  .ev.hl{border-color:var(--primary);box-shadow:0 0 0 2px #ecf5ff}
  .ev .eh{padding:9px 12px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--bd-l)}
  .ev .lev{display:flex;align-items:center;gap:2px}
  .ev .lev i{width:4px;height:12px;border-radius:1px;background:var(--bd)}
  .ev .lev i.on{background:var(--warning)}
  .ev .eid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--primary);background:#ecf5ff;border-radius:3px;padding:0 5px}
  .ev .etitle{font-weight:600;font-size:12.5px}
  .keyflag{font-size:10px;font-weight:700;color:#b8760f;background:#fdf6ec;border:1px solid #f5dab0;border-radius:3px;padding:0 6px}
  .ev .plat{margin-left:auto;font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px}
  .ro-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#5aaa2e;background:#f0f9eb;border-radius:3px;padding:0 5px}
  .ev .eb{padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
  .obs{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;font-family:ui-monospace,monospace}
  .obs .of{color:var(--t3)}.obs .ov{font-weight:600}.obs .ov.bad{color:var(--danger)}
  .ev .ef{padding:7px 12px;background:var(--bg2);border-top:1px solid var(--bd-l);display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t2)}
  .ver{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:11px}
  .ver .vd{width:8px;height:8px;border-radius:50%}
  .ver.ok{color:#5aaa2e}.ver.ok .vd{background:var(--success)}
  .ver.miss{color:var(--warning)}.ver.miss .vd{background:transparent;border:1.5px solid var(--warning)}

  /* agent trace / abstain assist */
  .assist{background:var(--white);border:1px solid var(--bd-l);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
  .assist h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .trace{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
  .tstep{display:flex;gap:9px;font-size:12px}
  .tstep .ti{flex-shrink:0;width:20px;height:20px;border-radius:5px;background:#fdf6ec;color:var(--warning);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
  .tool{font-family:ui-monospace,monospace;font-size:11px;background:var(--bg2);border:1px solid var(--bd-l);border-radius:3px;padding:1px 6px}
  .tr{color:var(--t3);margin-top:2px}
  .nextsteps{background:#ecf5ff;border:1px solid #d9ecff;border-radius:5px;padding:10px 12px;margin-top:10px}
  .nextsteps .ns-t{font-size:11px;font-weight:700;color:var(--primary-d);margin-bottom:6px}
  .nextsteps ul{margin:0 0 0 16px;font-size:12px;color:var(--t2)}
  .nextsteps li{margin:3px 0}
  .similar{margin-top:10px}
  .similar .si{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-top:1px dashed var(--bd-l)}
  .similar .si .code{font-family:ui-monospace,monospace;font-weight:600;color:var(--primary)}
  .similar .si .m{margin-left:auto;color:var(--t3);font-size:11px}

  .cite{display:inline-flex;align-items:center;gap:3px;background:#ecf5ff;color:var(--primary);border:1px solid #d9ecff;border-radius:3px;padding:0 6px;cursor:pointer;line-height:18px;font-size:11px;margin:2px 3px 0 0}
  .cite:hover,.cite.hl{background:var(--primary);color:#fff}

  /* ACT panel */
  .act .sla-box{padding:14px 16px;border-bottom:1px solid var(--bd-l);background:linear-gradient(180deg,#fff,#fafbfc)}
  .sla-box .clk{display:flex;align-items:baseline;gap:8px}
  .sla-box .clk .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .sla-box .clk .lbl{font-size:11px;color:var(--t3)}
  .sla-box .remain{margin-top:6px;font-size:12px;display:flex;align-items:center;gap:6px}
  .sla-box .remain b{font-variant-numeric:tabular-nums}
  .sla-box .remain.warn{color:var(--warning)}.sla-box .remain.crit{color:var(--danger)}
  .bar{height:5px;border-radius:3px;background:var(--bd-l);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--warning)}

  /* progress strip (demoted) */
  .prog{padding:12px 16px;border-bottom:1px solid var(--bd-l)}
  .prog .pt{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
  .pline{display:flex;flex-direction:column;gap:0}
  .pstep{display:flex;align-items:center;gap:9px;font-size:12px;position:relative;padding-bottom:9px}
  .pstep:last-child{padding-bottom:0}
  .pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--bd);background:var(--white);flex-shrink:0;z-index:1;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--t4)}
  .pstep .pl{position:absolute;left:7px;top:16px;bottom:1px;width:2px;background:var(--bd-l)}
  .pstep:last-child .pl{display:none}
  .pstep.done .pdot{border-color:var(--success);background:var(--success);color:#fff}
  .pstep.done .pl{background:var(--success)}
  .pstep.cur .pdot{border-color:var(--primary);background:var(--primary);box-shadow:0 0 0 3px #ecf5ff}
  .pstep.cur{font-weight:600;color:var(--primary)}
  .pstep.abst .pdot{border-color:var(--warning);background:var(--warning);color:#fff}
  .pstep.todo{color:var(--t4)}

  /* current-step action */
  .actbox{padding:14px 16px;flex:1}
  .actbox .at{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .actbox h2{font-size:15px;font-weight:600;margin-bottom:4px}
  .actbox .ad{font-size:12px;color:var(--t3);margin-bottom:12px}
  .snap{background:var(--bg2);border:1px solid var(--bd-l);border-radius:5px;padding:10px 12px;margin-bottom:12px}
  .snap .sk{font-size:11px;color:var(--t3)}.snap .sv{font-size:12px;font-weight:500;margin-bottom:6px}
  .snap .sv:last-child{margin-bottom:0}

  .btn{width:100%;border:1px solid var(--bd);background:var(--white);color:var(--t2);padding:9px 15px;border-radius:5px;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:8px;transition:.15s}
  .btn:hover:not(:disabled){color:var(--primary);border-color:#c6e2ff;background:#ecf5ff}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--primary-d);color:#fff}
  .btn.danger{background:var(--white);border-color:#f0a0a0;color:var(--danger)}
  .btn.danger:not(:disabled):hover{background:#fef0f0;color:var(--danger)}
  .btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* danger friction */
  .friction{background:#fef6f6;border:1px solid #fde2e2;border-radius:5px;padding:11px 12px;margin-bottom:10px}
  .friction .ft{font-size:12px;font-weight:600;color:var(--danger-d);margin-bottom:8px;display:flex;gap:6px}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--t2);cursor:pointer;margin-bottom:6px;line-height:1.4}
  .chk input{margin-top:2px}
  .redline{background:#fef0f0;border:1px solid #fde2e2;border-radius:5px;padding:9px 11px;font-size:11px;color:var(--danger-d);display:flex;gap:7px;margin-top:4px}
  .callout{background:#ecf5ff;border:1px solid #d9ecff;border-radius:5px;padding:9px 11px;font-size:11px;color:var(--primary-d);display:flex;gap:7px;margin-top:8px}
  .ic-warn{color:var(--danger);flex-shrink:0;font-weight:700}
  .tag{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600}
  .tag.red{background:#fef0f0;color:var(--danger);border:1px solid #fde2e2}
  .tag.gray{background:#f4f4f5;color:var(--info);border:1px solid #e9e9eb}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="logo">太</div>
    <a href="#">▦</a><a href="#">◈</a><a href="#">▤</a>
    <a href="#" class="active" title="智能排障">🩺</a>
    <a href="#">▧</a>
  </nav>

  <!-- QUEUE RAIL (situational awareness) -->
  <aside class="queue">
    <div class="qh"><b>值班队列</b><span class="cnt" id="qcnt">4 待处理</span></div>
    <div class="qfilter"><span class="on">全部</span><span>P0</span><span>命中</span><span>未命中</span></div>
    <div class="qlist" id="qlist"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb">智能排障 / <b id="crumb">CSDP-903001</b></div>
      <span class="demoflag">原型演示：下方切换器仅用于对比两种路由，非产品控件</span>
      <div class="switcher">
        <button class="on" onclick="load('hit')">命中路样本</button>
        <button onclick="load('miss')">未命中路样本</button>
      </div>
    </div>

    <div class="content">
      <!-- UNDERSTAND ZONE -->
      <div class="understand">
        <div class="idstrip" id="idstrip"></div>
        <div class="hero" id="hero"></div>
        <div id="evzone"></div>
      </div>

      <!-- ACT ZONE -->
      <div class="act">
        <div class="sla-box" id="slabox"></div>
        <div class="prog"><div class="pt">处置流水线</div><div class="pline" id="pline"></div></div>
        <div class="actbox" id="actbox"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- fixtures ---------- */
const DATA = {
  hit:{
    id:"CSDP-903001",route:"det",prio:"p0",
    openedMs:8*60000+42000, slaMs:30*60000,
    ident:[["系统","CSDP"],["error_code","903001"],["服务","order-svc"],["接入","告警 webhook"],["completeness","FULL"]],
    rootcause:"Mongo 连接池打满，导致 order-svc 数据库调用超时",
    rcsub:"路由键 (CSDP, 903001) 命中 · 规则引擎合成 · 全程零 LLM",
    conf:0.94,
    recact:{type:"write",title:"扩容连接池 / 重启 mongos 路由",desc:"生产写操作 · 需转派有权限的人在平台外执行"},
    evidence:[
      {id:"EV-2",kind:"metric",title:"Mongo 连接与可用性",plat:"观测云",ver:true,lev:3,key:true,
       obs:[["connections_current","2000",1],["connections_available","0",1],["slow_query_count","37",1],["reachable","true",0]],
       rule:"ratio_of_sum_gt(current,available) → 连接打满"},
      {id:"EV-1",kind:"log_count",title:"错误日志计数",plat:"观测云",ver:true,lev:2,key:false,
       obs:[["count","148",1],["trace_id","7f3a91c",0]],rule:"numeric_gte(count,1) → 确认发生"},
      {id:"EV-3",kind:"trace",title:"失败调用链定位",plat:"观测云",ver:false,lev:2,key:false,
       obs:[["failed_hop","mongo.find",0],["status","timeout",0],["duration_ms","30012",1]],
       rule:"contains_and_in(status,[timeout,error]) → DB 失败跳"},
    ],
    cites:["EV-2","EV-1","EV-3"],
    stage:2, // at 诊断确认
  },
  miss:{
    id:"CSDP-777012",route:"llm",prio:"p1",
    openedMs:3*60000+10000, slaMs:60*60000,
    ident:[["系统","CSDP"],["error_code","无 / 未抽出"],["服务","（未知）"],["接入","人工录入"],["completeness","SYMPTOM"]],
    rootcause:"系统弃权：证据不足以定因，转一线值班",
    rcsub:"未命中任何 (system,error_code) SOP · agent 只读探索未达置信阈值",
    conf:0.38, abstain:true,
    evidence:[
      {id:"EV-B",kind:"metric",title:"网关 P99 延迟（agent 只读查询）",plat:"观测云",ver:false,lev:2,key:false,ro:true,
       obs:[["p99_ms","8400",1],["p50_ms","210",0]],rule:"agent 观察：长尾延迟高，但无稳定规则命中"},
      {id:"EV-A",kind:"log_count",title:"近 15m 错误日志（agent 只读查询）",plat:"观测云",ver:false,lev:1,key:false,ro:true,
       obs:[["count","3",0],["trace_id","—",0]],rule:"agent 观察：错误量低，非硬故障"},
    ],
    cites:["EV-B","EV-A"],
    trace:[
      {tool:"collect_evidence(log_count, service=csdp-web)",r:"count=3，错误量低"},
      {tool:"collect_evidence(metric, metric=gateway_p99)",r:"p99=8400ms，长尾偏高"},
      {tool:"— 置信 0.38 < 阈值 0.70",r:"停止探索，弃权（未强凑结论）"},
    ],
    nextsteps:["核对网关近 1h 是否有发布/扩缩容变更","抓一条慢请求 trace 看卡在哪一跳","确认是否集中在某可用区/实例"],
    similar:[["CSDP-771too","网关长尾 → GC 停顿",0.72],["CSDP-760x","连接复用泄漏 → P99 抬升",0.65]],
    stage:3, // abstain
  }
};

const HIT_STEPS=[["intake","故障接入"],["evidence","自动取证"],["confirm","诊断确认"],["transfer","结构化转派"],["approve","人工批准"],["record","外部处置登记"],["close","关闭归档"]];
const MISS_STEPS=[["intake","故障接入"],["route","路由判定"],["agent","数字员工只读分诊"],["abstain","弃权 · 转人工"]];

const QUEUE=[
  {id:"CSDP-903001",route:"det",prio:"p0",sla:"warn",slaT:"剩 21:18",desc:"Mongo 连接池打满 · order-svc",k:"hit"},
  {id:"CSDP-777012",route:"llm",prio:"p1",sla:"",slaT:"剩 56:50",desc:"工单列表偶发很慢（无报错码）",k:"miss"},
  {id:"CSDP-2000001",route:"det",prio:"p1",sla:"",slaT:"剩 44:02",desc:"渠道回调签名校验失败",k:"hit"},
  {id:"CSDP-801008",route:"det",prio:"p0",sla:"crit",slaT:"剩 04:37",desc:"主数据同步中断 · 批量超时",k:"hit"},
];

let cur, stage, ticker;
function renderQueue(activeId){
  document.getElementById('qlist').innerHTML = QUEUE.map(q=>`
    <div class="qitem ${q.id===activeId?'active':''}" onclick="load('${q.k}')">
      <div class="r1"><span class="prio ${q.prio}">${q.prio.toUpperCase()}</span>
        <span class="code">${q.id}</span></div>
      <div class="r2">${q.desc}</div>
      <div class="r3">
        <span class="rchip ${q.route}"><span class="sh"></span>${q.route==='det'?'确定性':'未命中'}</span>
        <span class="sla ${q.sla}" style="margin-left:auto">⏱ ${q.slaT}</span>
      </div>
    </div>`).join('');
}

function fmt(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);const ss=s%60;return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}

function load(which){
  cur=DATA[which]; stage=cur.stage;
  document.querySelectorAll('.switcher button').forEach((b,i)=>b.classList.toggle('on',i===(which==='hit'?0:1)));
  document.getElementById('crumb').textContent=cur.id;
  renderQueue(cur.id);
  renderIdent(); renderHero(); renderEv(); renderProg(); renderAct(); startClock();
}

function renderIdent(){
  const routeChip = cur.route==='det'
    ? '<span class="rchip det"><span class="sh"></span>确定性 · 零 LLM</span>'
    : '<span class="rchip llm"><span class="sh"></span>未命中 · agent 只读</span>';
  document.getElementById('idstrip').innerHTML =
    `<span class="idcode">${cur.id}</span>${routeChip}<span class="sep"></span>` +
    cur.ident.map(([k,v])=>`<span class="idkv">${k} <b>${v}</b></span>`).join('<span class="sep"></span>');
}

function renderHero(){
  const hi=!cur.abstain, pct=Math.round(cur.conf*100);
  const ptrCls=cur.conf>=0.7?'hi':'lo';
  const zoneLab=cur.conf>=0.7?'高于自动建议阈值':'低于阈值 → 系统弃权';
  const recHtml = cur.abstain ? '' : `
    <div class="recact">
      <div class="ra-ic write">写</div>
      <div><div class="ra-t"><span class="tag red">生产写</span> ${cur.recact.title}</div>
      <div class="ra-d">${cur.recact.desc}</div></div>
    </div>`;
  document.getElementById('hero').innerHTML = `
    <div class="hero-inner">
    <div class="hlabel">${cur.abstain?'诊断结论 · 弃权':'诊断结论 · Diagnosis'} <span style="margin-left:auto;color:var(--t4)">contract v1</span></div>
    <div class="rootcause ${cur.abstain?'abst':''}">${cur.abstain?'⚠ ':''}${cur.rootcause}</div>
    <div class="rcsub">${cur.rcsub}</div>
    <div class="confwrap">
      <div class="confbig"><div class="num ${ptrCls}">${cur.conf.toFixed(2)}</div><div class="lab ${ptrCls}">${cur.abstain?'置信不足':'置信度'}</div></div>
      <div class="meter">
        <div class="mtop"><span>0.0 不确定</span><span>确定 1.0</span></div>
        <div class="track"><div class="thresh"></div><div class="ptr ${ptrCls}" style="left:${pct}%"></div></div>
        <div style="text-align:center;font-size:11px;margin-top:8px;color:${cur.conf>=0.7?'#5aaa2e':'#b88230'};font-weight:600">${zoneLab}</div>
      </div>
    </div>
    ${recHtml}
    <div style="margin-top:12px;font-size:12px;color:var(--t3)">引用证据（按诊断杠杆排序）：
      ${cur.cites.map(c=>`<span class="cite" onmouseenter="hlEv('${c}',1)" onmouseleave="hlEv('${c}',0)" onclick="scrollEv('${c}')">🔗 ${c}</span>`).join('')}</div>
    </div>`;
  document.getElementById('hero').className='hero '+cur.route;
}

function renderEv(){
  let html='';
  if(cur.abstain){
    // abstain assist: trace + next steps + similar
    html += `<div class="assist">
      <h3>🔒 agent 只读探索轨迹（ReAct）<span class="ro-tag" style="margin-left:auto">工具绑定锁死只读 · ToolGuard BLOCK 写/shell</span></h3>
      <div class="trace">${cur.trace.map((t,i)=>`<div class="tstep"><div class="ti">${i+1}</div><div><span class="tool">${t.tool}</span><div class="tr">${t.r}</div></div></div>`).join('')}</div>
      <div class="nextsteps"><div class="ns-t">↳ 系统替你减负：建议人工下一步先查</div>
        <ul>${cur.nextsteps.map(n=>`<li>${n}</li>`).join('')}</ul></div>
      <div class="similar"><div class="ns-t" style="color:var(--t3);font-weight:700;font-size:11px;margin-bottom:2px">相似历史故障</div>
        ${cur.similar.map(([c,d,s])=>`<div class="si"><span class="code">${c}</span> ${d}<span class="m">相似度 ${s.toFixed(2)}</span></div>`).join('')}</div>
    </div>`;
  }
  html += `<div class="evsec"><h3>取证 <span class="hint">${cur.abstain?'agent 只读采集':'按诊断杠杆排序 · 决定性证据置顶'}</span></h3>`;
  html += cur.evidence.map(e=>`
    <div class="ev ${e.key?'decisive':''}" id="ev-${e.id}">
      <div class="eh">
        <span class="lev" title="诊断杠杆">${[1,2,3].map(i=>`<i class="${i<=e.lev?'on':''}"></i>`).join('')}</span>
        <span class="eid">${e.id}</span><span class="etitle">${e.title}</span>
        ${e.key?'<span class="keyflag">🔑 决定性 · 翻转则结论翻转</span>':''}
        ${e.ro?'<span class="ro-tag">🔒 只读</span>':''}
        <span class="plat">${e.plat}</span>
      </div>
      <div class="eb">${e.obs.map(([f,v,bad])=>`<div class="obs"><span class="of">${f}</span><span class="ov ${bad?'bad':''}">${v}</span></div>`).join('')}</div>
      <div class="ef"><span>判据：${e.rule}</span>
        <span class="ver ${e.ver?'ok':'miss'}"><span class="vd"></span>${e.ver?'已核实':'待内网核实'}</span></div>
    </div>`).join('')+'</div>';
  document.getElementById('evzone').innerHTML=html;
}

function renderProg(){
  const steps=cur.route==='det'?HIT_STEPS:MISS_STEPS;
  document.getElementById('pline').innerHTML=steps.map(([k,t],i)=>{
    let cls=i<stage?'done':(i===stage?'cur':'todo');
    if(cur.abstain&&k==='abstain')cls='abst cur';
    const inner=cls.includes('done')?'✓':(cls.includes('abst')?'!':'');
    return `<div class="pstep ${cls}"><div class="pdot">${inner}</div><div class="pl"></div><span>${t}</span></div>`;
  }).join('');
}

function renderAct(){
  const box=document.getElementById('actbox');
  const steps=cur.route==='det'?HIT_STEPS:MISS_STEPS;
  const k=cur.abstain?'abstain':(steps[stage]?steps[stage][0]:'close');
  box.innerHTML=actPanel(k);
}

function actPanel(k){
  if(k==='confirm')return `
    <div class="at">当前步 · 需 operate:troubleshooting</div><h2>诊断确认</h2>
    <div class="ad">确认后状态机推进到「结构化转派」。此动作不触发任何执行。</div>
    <button class="btn primary" onclick="adv()">✓ 确认诊断</button>
    <button class="btn" onclick="alert('携当前上下文快照转人工复核')">转人工复核</button>
    <div class="callout"><span>ℹ️</span><span>命中路结论来自 <code>diagnosis_rules</code> 匹配，全程零 LLM。</span></div>`;
  if(k==='transfer')return `
    <div class="at">当前步</div><h2>结构化转派</h2>
    <div class="ad">携带完整上下文快照转给 owner，接收方无需重新排查。</div>
    <div class="snap">
      <div class="sk">目标 owner</div><div class="sv">DBA · 张（占位）</div>
      <div class="sk">根因</div><div class="sv">${cur.rootcause}</div>
      <div class="sk">证据</div><div class="sv">${cur.cites.join(', ')} · trace 7f3a91c</div>
    </div>
    <button class="btn primary" onclick="adv()">→ 结构化转派</button>
    <button class="btn" onclick="back()">返回</button>`;
  if(k==='approve')return `
    <div class="at">当前步 · 不可逆动作</div><h2>人工批准</h2>
    <div class="ad">待批准的恢复动作（生产写）：</div>
    <div class="snap"><div class="sv"><span class="tag red">生产写</span> ${cur.recact.title}</div>
      <div class="sk">由有权限的人在 MateClaw 外执行 · 平台不执行</div></div>
    <div class="friction">
      <div class="ft"><span class="ic-warn">⛔</span>批准前必须复核（摩擦与后果成正比）</div>
      <label class="chk"><input type="checkbox" onchange="armApprove()"> 我已核对 3 项证据，确认根因判断成立</label>
      <label class="chk"><input type="checkbox" onchange="armApprove()"> 我确认此写操作由外部有权限的人执行，非本页面触发</label>
    </div>
    <button class="btn danger" id="approveBtn" disabled onclick="adv()">批准（推进状态，系统不执行）</button>
    <button class="btn" onclick="alert('驳回：状态回到诊断确认')">驳回</button>
    <div class="redline"><span class="ic-warn">R1/R2</span><span>页面无"执行"按钮。批准只把状态 <code>PENDING_APPROVAL → APPROVED_NOT_EXECUTED</code>；生产写执行器不接入平台。</span></div>`;
  if(k==='record')return `
    <div class="at">当前步</div><h2>外部处置登记</h2>
    <div class="ad">人在平台外执行后回填结果与恢复验证。</div>
    <div class="snap">
      <div class="sk">处置人</div><div class="sv">DBA · 张</div>
      <div class="sk">处置动作</div><div class="sv">已扩容 mongos 连接池 → 4000</div>
      <div class="sk">恢复验证</div><div class="sv" style="color:#5aaa2e">已恢复 · 复测 count=0</div>
    </div>
    <button class="btn primary" onclick="adv()">↧ 登记并进入关闭</button>
    <div class="callout"><span>R3</span><span>平台只记录"谁做了什么、是否恢复"，不连生产写执行器。</span></div>`;
  if(k==='close')return `
    <div class="at">当前步</div><h2>关闭归档 → 知识沉淀</h2>
    <div class="ad">系统预填知识候选，进专家审核队列，不直接覆盖 SOP。</div>
    <button class="btn primary" onclick="alert('已关闭。生成 candidate #C-903001-a，进入审核队列（manage:troubleshooting）。')">✓ 关闭并生成知识候选</button>
    <div class="callout"><span>🌱</span><span>D6：候选从一线沉淀来，专家毕业后回到一线工作台/卡片。</span></div>`;
  if(k==='abstain')return `
    <div class="at">当前状态 · 弃权</div><h2>转一线值班</h2>
    <div class="ad">系统未强凑结论。已把 agent 已取证据、下一步建议、相似历史一并打包，供人接手不从零开始。</div>
    <button class="btn primary" onclick="alert('已携 agent 轨迹 + EV-A/B + 下一步建议 + 相似故障，转一线值班。')">→ 转一线值班（带线索）</button>
    <button class="btn" onclick="alert('登记为知识缺口 backlog，供后续补 SOP。')">记为知识缺口</button>
    <div class="callout"><span>ℹ️</span><span>弃权也替人减负：不是把问题原样丢回，而是给一个"跑起来的起点"。</span></div>`;
  return `<div class="at">已完成</div><h2>处置闭环完成</h2><div class="ad">本单已关闭并沉淀知识候选。</div>`;
}

function armApprove(){
  const chks=document.querySelectorAll('.friction input');
  const all=[...chks].every(c=>c.checked);
  const b=document.getElementById('approveBtn');
  b.disabled=!all; b.classList.toggle('armed',all);
}
function hlEv(id,on){const el=document.getElementById('ev-'+id);if(el)el.classList.toggle('hl',!!on);
  document.querySelectorAll('.cite').forEach(c=>{if(c.textContent.includes(id))c.classList.toggle('hl',!!on)});}
function scrollEv(id){const el=document.getElementById('ev-'+id);if(el){el.classList.add('hl');el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>el.classList.remove('hl'),1400);}}
function adv(){stage++;renderProg();renderAct();}
function back(){if(stage>0){stage--;renderProg();renderAct();}}

function startClock(){
  clearInterval(ticker);
  const start=Date.now()-cur.openedMs;
  function tick(){
    const open=Date.now()-start; const remain=cur.slaMs-open;
    const rc=remain<5*60000?'crit':(remain<10*60000?'warn':'');
    const pct=Math.min(100,open/cur.slaMs*100);
    document.getElementById('slabox').innerHTML=`
      <div class="clk"><span class="big">${fmt(open)}</span><span class="lbl">已开启</span></div>
      <div class="remain ${rc}">SLA 剩余 <b>${fmt(Math.max(0,remain))}</b>${rc==='crit'?' · 即将违约':''}</div>
      <div class="bar"><i style="width:${pct}%;background:${rc==='crit'?'#F56C6C':rc==='warn'?'#E6A23C':'#67C23A'}"></i></div>`;
  }
  tick(); ticker=setInterval(tick,1000);
}

load('hit');
</script>
</body>
</html>
