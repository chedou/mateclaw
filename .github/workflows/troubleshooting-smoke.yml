name: Troubleshooting smoke

on:
  pull_request:
    paths:
      - '.github/workflows/troubleshooting-smoke.yml'
      - 'pom.xml'
      - 'mateclaw-plugin-api/**'
      - 'mateclaw-server/**'
      - 'scripts/troubleshooting-smoke.sh'
  push:
    branches:
      - main
      - intelligent-troubleshooting
      - claude/intelligent-troubleshooting-design
    paths:
      - '.github/workflows/troubleshooting-smoke.yml'
      - 'pom.xml'
      - 'mateclaw-plugin-api/**'
      - 'mateclaw-server/**'
      - 'scripts/troubleshooting-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-diagnosis-path:
    name: Default diagnosis path stays runnable
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Start clone-to-diagnosis timer
        run: echo "TROUBLESHOOTING_SMOKE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install plugin API dependency
        run: mvn -B -pl mateclaw-plugin-api -DskipTests install

      - name: Start troubleshooting demo server
        run: |
          log_file="$RUNNER_TEMP/troubleshooting-smoke-server.log"
          pid_file="$RUNNER_TEMP/troubleshooting-smoke-server.pid"
          nohup mvn -B -pl mateclaw-server -DskipTests spring-boot:run \
            -Dspring-boot.run.profiles=dev,troubleshooting-demo \
            >"$log_file" 2>&1 &
          echo "$!" > "$pid_file"

          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","password":"admin123"}' \
              http://127.0.0.1:18088/api/v1/auth/login >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$pid_file")" 2>/dev/null; then
              tail -200 "$log_file"
              exit 1
            fi
            sleep 2
          done

          tail -200 "$log_file"
          exit 1

      - name: Run operator-level smoke
        env:
          MATECLAW_USERNAME: admin
          MATECLAW_PASSWORD: admin123
          MATECLAW_SMOKE_DIAGNOSIS_OBSERVED_AT_FILE: ${{ runner.temp }}/troubleshooting-smoke-diagnosis-observed-at
        run: ./scripts/troubleshooting-smoke.sh

      - name: Record clone-to-diagnosis duration
        if: success()
        run: |
          observed_at_file="$RUNNER_TEMP/troubleshooting-smoke-diagnosis-observed-at"
          if [[ ! -r "$observed_at_file" ]]; then
            echo "::error::Smoke passed without recording when its first Diagnosis was observed"
            exit 1
          fi
          diagnosis_observed_at="$(<"$observed_at_file")"
          if [[ ! "$diagnosis_observed_at" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Diagnosis observation timestamp: $diagnosis_observed_at"
            exit 1
          fi
          elapsed_seconds=$(( diagnosis_observed_at - TROUBLESHOOTING_SMOKE_STARTED_AT ))
          if (( elapsed_seconds < 0 )); then
            echo "::error::Diagnosis observation timestamp precedes the CI timer"
            exit 1
          fi
          {
            echo '### Troubleshooting smoke'
            echo
            echo "- Clone to first diagnosis: ${elapsed_seconds}s"
            echo '- Target: no more than 300s'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed_seconds > 300 )); then
            echo "::warning::Clone-to-diagnosis duration ${elapsed_seconds}s exceeded the 300s target"
          fi

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: troubleshooting-smoke-server-log
          path: ${{ runner.temp }}/troubleshooting-smoke-server.log
          if-no-files-found: ignore

      - name: Stop troubleshooting demo server
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/troubleshooting-smoke-server.pid"
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
