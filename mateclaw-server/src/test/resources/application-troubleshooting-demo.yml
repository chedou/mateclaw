spring:
  config:
    activate:
      on-profile: troubleshooting-demo

# Test-only walkable scenarios, entirely on the recorded fixture.
#
# This profile exists because the domain's gates are all fail-closed and their
# conjunction left no default path: no evidence source is on, and the repository
# ships no Playbook, so every report missed the route. Activating this profile
# opens explicitly marked demo doors — it does not touch any real
# observability binding and does not change the fixture marking on results.
#
#   mvn -pl mateclaw-server -DskipTests test-compile
#   fixture_jar="$(./scripts/package-troubleshooting-demo-fixture.sh)"
#   mvn -pl mateclaw-server \
#       -Dspring-boot.run.additional-classpath-elements="${fixture_jar}" \
#       -Dspring-boot.run.profiles=troubleshooting-demo \
#       spring-boot:run
#   ./scripts/troubleshooting-smoke.sh
mateclaw:
  troubleshooting:
    demo:
      enabled: true
      workspace-id: ${MATECLAW_TROUBLESHOOTING_DEMO_WORKSPACE_ID:1}
    evidence:
      # Recorded Replay only. Guance stays off: a demo must never be able to
      # reach a real observability source by accident.
      routes:
        CSDP:
          log_count: [recorded-replay]
          metric: [recorded-replay]
          trace: [recorded-replay]
          log_search: [recorded-replay]
          log_trace_bundle: [recorded-replay]
          contrast_sample: [recorded-replay]
      recorded-replay:
        enabled: true
